theme:
  name: material
  logo: img/logo2.png
  favicon: img/logo.png
  language: en
  font:
    text: Roboto
  features:
  - navigation.tracking
  - navigation.top
  - content.image-zoom
  hide:
  - header.title
  palette:
    scheme: default
    primary: deep purple
    accent: purple
plugins:
- blog
- search
- include-markdown
- i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          theme:
            language: ru
